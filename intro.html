<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Intro — Profile</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d0f12;
      --panel: #15181d;
      --panel-hover: #1c2026;
      --text: #f4f4f5;
      --muted: #8b9098;
      --line: #3b4048;
      --accent: #ffffff;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    /* ---------------------------------------------------------
       PROFILE HEADER
    --------------------------------------------------------- */

    .profile-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 90px;

      display: flex;
      align-items: center;
      gap: 14px;

      padding: 18px 24px;

      background: linear-gradient(
        to bottom,
        rgba(13, 15, 18, 0.98),
        rgba(13, 15, 18, 0)
      );

      z-index: 10;
    }

    .avatar {
      width: 48px;
      height: 48px;

      border-radius: 50%;
      background: #2a2e35;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 18px;
      font-weight: 600;
    }

    .profile-info h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .username {
      margin-top: 2px;
      font-size: 14px;
      color: var(--muted);
    }

    /* ---------------------------------------------------------
       GRAPH AREA
    --------------------------------------------------------- */

    .graph {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    /* SVG containing branch lines */

    .connections {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;
    }

    .connection-line {
      stroke: var(--line);
      stroke-width: 2;
    }

    /* ---------------------------------------------------------
       NODES
    --------------------------------------------------------- */

    .node {
      position: absolute;

      width: 110px;
      height: 110px;

      border-radius: 50%;
      border: 1px solid #343941;

      background: var(--panel);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      transform: translate(-50%, -50%);

      transition:
        transform 0.15s ease,
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .node:hover {
      background: var(--panel-hover);
      border-color: #646b75;

      transform:
        translate(-50%, -50%)
        scale(1.06);
    }

    .node-title {
      font-size: 14px;
      font-weight: 600;
    }

    .node-subtitle {
      margin-top: 4px;

      font-size: 11px;
      color: var(--muted);
    }

    /* Main introduction node */

    .root-node {
      width: 145px;
      height: 145px;

      border: 2px solid var(--accent);
    }

    .root-node .node-title {
      font-size: 16px;
    }

    /* ---------------------------------------------------------
       NODE POSITIONS
    --------------------------------------------------------- */

    #intro {
      left: 50%;
      top: 30%;
    }

    #work {
      left: 28%;
      top: 64%;
    }

    #personal {
      left: 50%;
      top: 69%;
    }

    #interests {
      left: 72%;
      top: 64%;
    }

    /* ---------------------------------------------------------
       ADD BUTTON
    --------------------------------------------------------- */

    .add-button {
      position: fixed;

      right: 28px;
      bottom: 28px;

      width: 56px;
      height: 56px;

      border: none;
      border-radius: 50%;

      background: #f5f5f5;
      color: #111;

      font-size: 28px;
      font-weight: 300;

      cursor: pointer;

      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.35);

      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .add-button:hover {
      transform: scale(1.07);
      background: white;
    }

    /* ---------------------------------------------------------
       VIDEO MODAL
    --------------------------------------------------------- */

    .modal {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.82);

      backdrop-filter: blur(8px);

      z-index: 100;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      position: relative;

      width: min(850px, 90vw);

      background: #111318;

      border: 1px solid #2c3037;
      border-radius: 18px;

      padding: 24px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 18px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 600;
    }

    .close-button {
      border: none;
      background: none;

      color: var(--muted);

      font-size: 28px;
      cursor: pointer;
    }

    .video-placeholder {
      width: 100%;
      aspect-ratio: 16 / 9;

      border-radius: 12px;

      background: #08090b;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--muted);
      font-size: 14px;
    }

    /* ---------------------------------------------------------
       RESPONSIVE
    --------------------------------------------------------- */

    @media (max-width: 600px) {

      .node {
        width: 90px;
        height: 90px;
      }

      .root-node {
        width: 120px;
        height: 120px;
      }

      #work {
        left: 20%;
      }

      #interests {
        left: 80%;
      }
    }

  </style>
</head>

<body>

  <!-- =======================================================
       PROFILE HEADER
  ======================================================== -->

  <header class="profile-header">

    <div class="avatar">
      AJ
    </div>

    <div class="profile-info">
      <h1>AJ</h1>
      <div class="username">@aj</div>
    </div>

  </header>


  <!-- =======================================================
       PROFILE GRAPH
  ======================================================== -->

  <main class="graph">

    <!-- Connection lines -->

    <svg class="connections">

      <line
        id="line-work"
        class="connection-line"
      />

      <line
        id="line-personal"
        class="connection-line"
      />

      <line
        id="line-interests"
        class="connection-line"
      />

    </svg>


    <!-- ROOT NODE -->

    <div
      class="node root-node"
      id="intro"
      data-title="Introduction"
    >

      <div class="node-title">
        Introduction
      </div>

      <div class="node-subtitle">
        2:14
      </div>

    </div>


    <!-- CHILD NODE 1 -->

    <div
      class="node"
      id="work"
      data-title="Work"
    >

      <div class="node-title">
        Work
      </div>

      <div class="node-subtitle">
        1:32
      </div>

    </div>


    <!-- CHILD NODE 2 -->

    <div
      class="node"
      id="personal"
      data-title="Personal"
    >

      <div class="node-title">
        Personal
      </div>

      <div class="node-subtitle">
        1:48
      </div>

    </div>


    <!-- CHILD NODE 3 -->

    <div
      class="node"
      id="interests"
      data-title="Interests"
    >

      <div class="node-title">
        Interests
      </div>

      <div class="node-subtitle">
        1:15
      </div>

    </div>

  </main>


  <!-- =======================================================
       ADD NODE BUTTON
  ======================================================== -->

  <button
    class="add-button"
    id="addButton"
    aria-label="Add branch"
  >
    +
  </button>


  <!-- =======================================================
       VIDEO MODAL
  ======================================================== -->

  <div
    class="modal"
    id="videoModal"
  >

    <div class="modal-content">

      <div class="modal-header">

        <div
          class="modal-title"
          id="modalTitle"
        >
          Introduction
        </div>

        <button
          class="close-button"
          id="closeModal"
        >
          ×
        </button>

      </div>

      <div class="video-placeholder">
        Video will play here
      </div>

    </div>

  </div>


  <!-- =======================================================
       JAVASCRIPT
  ======================================================== -->

  <script>

    /* -------------------------------------------------------
       ELEMENT REFERENCES
    ------------------------------------------------------- */

    const intro = document.getElementById("intro");
    const work = document.getElementById("work");
    const personal = document.getElementById("personal");
    const interests = document.getElementById("interests");

    const modal = document.getElementById("videoModal");
    const modalTitle = document.getElementById("modalTitle");

    const closeModal =
      document.getElementById("closeModal");

    const addButton =
      document.getElementById("addButton");


    /* -------------------------------------------------------
       DRAW CONNECTION BETWEEN TWO NODES
    ------------------------------------------------------- */

    function connectNodes(parent, child, line) {

      const parentRect =
        parent.getBoundingClientRect();

      const childRect =
        child.getBoundingClientRect();


      const x1 =
        parentRect.left +
        parentRect.width / 2;

      const y1 =
        parentRect.top +
        parentRect.height / 2;


      const x2 =
        childRect.left +
        childRect.width / 2;

      const y2 =
        childRect.top +
        childRect.height / 2;


      line.setAttribute("x1", x1);
      line.setAttribute("y1", y1);

      line.setAttribute("x2", x2);
      line.setAttribute("y2", y2);

    }


    /* -------------------------------------------------------
       DRAW GRAPH
    ------------------------------------------------------- */

    function drawConnections() {

      connectNodes(
        intro,
        work,
        document.getElementById("line-work")
      );

      connectNodes(
        intro,
        personal,
        document.getElementById("line-personal")
      );

      connectNodes(
        intro,
        interests,
        document.getElementById("line-interests")
      );

    }


    window.addEventListener(
      "load",
      drawConnections
    );

    window.addEventListener(
      "resize",
      drawConnections
    );


    /* -------------------------------------------------------
       OPEN VIDEO
    ------------------------------------------------------- */

    document
      .querySelectorAll(".node")
      .forEach(node => {

        node.addEventListener(
          "click",
          () => {

            modalTitle.textContent =
              node.dataset.title;

            modal.classList.add("open");

          }
        );

      });


    /* -------------------------------------------------------
       CLOSE VIDEO
    ------------------------------------------------------- */

    closeModal.addEventListener(
      "click",
      () => {

        modal.classList.remove("open");

      }
    );


    modal.addEventListener(
      "click",
      event => {

        if (event.target === modal) {
          modal.classList.remove("open");
        }

      }
    );


    /* -------------------------------------------------------
       ADD BRANCH
       Placeholder behavior for prototype
    ------------------------------------------------------- */

    addButton.addEventListener(
      "click",
      () => {

        alert(
          "Next step: choose a node and create a new branch."
        );

      }
    );

  </script>

</body>
</html>
